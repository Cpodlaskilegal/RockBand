name: Release VSIX

on:
  workflow_dispatch:
  push:
    tags:
      - "extension-v*"

jobs:
  package-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run package:extension
      - uses: actions/upload-artifact@v4
        with:
          name: hosted-symphony-vsix
          path: apps/vscode-extension/hosted-symphony.vsix
